<!-- Page Loading Overlay -->
<div id="page-loading-overlay" class="fixed inset-0 bg-white bg-opacity-90 backdrop-blur-sm z-50 hidden flex items-center justify-center">
    <div class="text-center">
        <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-blue mb-4"></div>
        <div class="text-lg font-semibold text-gray-800 mb-2">Chargement...</div>
        <div id="loading-page-name" class="text-sm text-gray-600"></div>
    </div>
</div>

<script>
    // Mobile menu toggle functionality and current page highlighting
    document.addEventListener('DOMContentLoaded', function() {
        const mobileMenuButton = document.getElementById('mobile-menu-button');
        const mobileMenu = document.getElementById('mobile-menu');
        
        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Highlight current page in navigation
        function highlightCurrentPage() {
            let currentPage = window.location.pathname.split('/').pop() || 'index.html';
            
            // Handle root path and empty cases
            if (currentPage === '' || window.location.pathname === '/' || window.location.pathname.endsWith('/')) {
                currentPage = 'index.html';
            }
            
            console.log('Current page detected:', currentPage); // Debug log
            
            // Get all navigation links (desktop and mobile)
            const navLinks = document.querySelectorAll('.nav-link');
            const mobileNavLinks = document.querySelectorAll('.mobile-nav-link');
            
            // Function to reset all links to default styles
            function resetAllLinks() {
                navLinks.forEach(link => {
                    link.classList.remove('text-blue', 'text-white', 'font-semibold', 'border-b-2', 'border-blue', 'pb-1', 'bg-blue-50', 'bg-blue', 'shadow-md', 'border-2', 'border-blue-600');
                    link.classList.add('text-gray-600');
                });
                
                mobileNavLinks.forEach(link => {
                    link.classList.remove('text-blue', 'text-white', 'bg-blue-50', 'bg-blue', 'font-semibold', 'border-l-4', 'border-blue', 'border-blue-700', 'shadow-md');
                    link.classList.add('text-gray-700');
                });
            }
            
            // Function to apply active styles
            function applyActiveStyles(link, isMobile = false) {
                if (isMobile) {
                    link.classList.remove('text-gray-700', 'hover:bg-gray-100');
                    link.classList.add('text-white', 'bg-blue', 'font-semibold', 'border-l-4', 'border-blue-700', 'shadow-md');
                } else {
                    link.classList.remove('text-gray-600');
                    link.classList.add('text-white', 'bg-blue', 'font-semibold', 'shadow-md', 'border-2', 'border-blue-600');
                }
            }
            
            // Reset all links first
            resetAllLinks();
            
            // Check desktop nav links
            navLinks.forEach(link => {
                const linkPage = link.getAttribute('href');
                if (linkPage === currentPage || 
                    (currentPage === 'index.html' && (linkPage === 'index.html' || linkPage === '/')) ||
                    (currentPage === '' && linkPage === 'index.html')) {
                    applyActiveStyles(link);
                    console.log('Active desktop link found:', linkPage); // Debug log
                }
            });
            
            // Check mobile nav links
            mobileNavLinks.forEach(link => {
                const linkPage = link.getAttribute('href');
                if (linkPage === currentPage || 
                    (currentPage === 'index.html' && (linkPage === 'index.html' || linkPage === '/')) ||
                    (currentPage === '' && linkPage === 'index.html')) {
                    applyActiveStyles(link, true);
                    console.log('Active mobile link found:', linkPage); // Debug log
                }
            });
        }
        
        // Call the function to highlight current page
        highlightCurrentPage();

        // Add click handlers for navigation links with loading UI
        function addNavigationClickHandlers() {
            const allNavLinks = document.querySelectorAll('.nav-link, .mobile-nav-link');
            const loadingOverlay = document.getElementById('page-loading-overlay');
            const loadingPageName = document.getElementById('loading-page-name');
            
            // Page name mapping
            const pageNames = {
                'index.html': 'Accueil',
                'clients.html': 'Clients',
                'partenaires.html': 'Partenaires', 
                'tarifs.html': 'Tarifs',
                'politique.html': 'Politique de confidentialité',
                'conditions.html': "Conditions d'utilisation",
                'applicationForm.html': 'Formulaire de candidature'
            };
            
            allNavLinks.forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    let currentPage = window.location.pathname.split('/').pop() || 'index.html';
                    
                    // Handle root path cases
                    if (currentPage === '' || window.location.pathname === '/' || window.location.pathname.endsWith('/')) {
                        currentPage = 'index.html';
                    }
                    
                    // Don't show loading for same page or external links
                    if (href === currentPage || href.startsWith('http') || href.startsWith('#')) {
                        return;
                    }
                    
                    // Immediately apply clicked state to this link
                    allNavLinks.forEach(navLink => {
                        navLink.classList.remove('text-blue', 'text-white', 'font-semibold', 'border-b-2', 'border-blue', 'pb-1', 'bg-blue-50', 'bg-blue', 'shadow-md', 'border-2', 'border-blue-600', 'border-l-4', 'border-blue-700');
                        if (navLink.classList.contains('nav-link')) {
                            navLink.classList.add('text-gray-600');
                        } else {
                            navLink.classList.add('text-gray-700');
                        }
                    });
                    
                    // Apply active state to clicked link
                    if (this.classList.contains('nav-link')) {
                        this.classList.remove('text-gray-600');
                        this.classList.add('text-white', 'bg-blue', 'font-semibold', 'shadow-md', 'border-2', 'border-blue-600');
                    } else {
                        this.classList.remove('text-gray-700');
                        this.classList.add('text-white', 'bg-blue', 'font-semibold', 'border-l-4', 'border-blue-700', 'shadow-md');
                    }
                    
                    // Show loading overlay
                    const pageName = pageNames[href] || href.replace('.html', '');
                    loadingPageName.textContent = `Chargement de ${pageName}...`;
                    loadingOverlay.classList.remove('hidden');
                    
                    // Add visual feedback to clicked link
                    this.classList.add('opacity-75', 'scale-95');
                    
                    // Close mobile menu if open
                    if (mobileMenu) {
                        mobileMenu.classList.add('hidden');
                    }
                    
                    console.log('Navigating from', currentPage, 'to', href); // Debug log
                    
                    // Small delay to show the loading animation before navigation
                    setTimeout(() => {
                        window.location.href = href;
                    }, 300);
                    
                    // Prevent default link behavior to control timing
                    e.preventDefault();
                });
            });
        }
        
        // Initialize navigation click handlers
        addNavigationClickHandlers();
        
        // Hide loading overlay when page finishes loading
        window.addEventListener('load', function() {
            const loadingOverlay = document.getElementById('page-loading-overlay');
            if (loadingOverlay) {
                loadingOverlay.classList.add('hidden');
            }
        });
    });
</script>

<style>
    /* Loading overlay animation */
    #page-loading-overlay {
        transition: opacity 0.3s ease-in-out;
    }
    
    /* Navigation link click animation */
    .nav-link, .mobile-nav-link {
        transition: all 0.2s ease;
    }
    
    /* Spinner animation */
    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
    
    .animate-spin {
        animation: spin 1s linear infinite;
    }
    
    /* Scale animation for clicked links */
    .scale-95 {
        transform: scale(0.95);
    }
    
    /* Fade in animation for page content */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    .fade-in {
        animation: fadeIn 0.3s ease-out;
    }
</style>
