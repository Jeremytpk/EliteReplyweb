<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - EliteReply</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto py-12 px-4">
        <h1 class="text-4xl font-bold text-gray-900 mb-8 text-center">Analytics Dashboard</h1>
        <div id="summary" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-xl font-bold mb-4">Visits by Date</h2>
                <canvas id="visitsChart"></canvas>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-xl font-bold mb-4">Countries</h2>
                <canvas id="countriesChart"></canvas>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-12">
            <h2 class="text-xl font-bold mb-4">Events Log</h2>
            <div class="overflow-x-auto">
                <table class="min-w-full text-sm">
                    <thead>
                        <tr class="bg-gray-100">
                            <th class="px-4 py-2">Date</th>
                            <th class="px-4 py-2">Page</th>
                            <th class="px-4 py-2">Type</th>
                            <th class="px-4 py-2">Country</th>
                            <th class="px-4 py-2">Details</th>
                        </tr>
                    </thead>
                    <tbody id="eventsTable"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        import { firebaseConfig } from "../firebaseConfig.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        async function fetchAnalytics() {
            const datasCol = collection(db, "datas");
            const snapshot = await getDocs(datasCol);
            let summary = { views: 0, clicks: 0, downloads: 0 };
            let visitsByDate = {};
            let countries = {};
            let events = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                summary.views += d.views || 0;
                summary.clicks += d.clicks || 0;
                summary.downloads += d.downloads || 0;
                visitsByDate[d.date] = (visitsByDate[d.date] || 0) + (d.views || 0);
                Object.entries(d.countries || {}).forEach(([country, count]) => {
                    countries[country] = (countries[country] || 0) + count;
                });
                (d.events || []).forEach(ev => {
                    events.push({ ...ev, date: d.date, page: d.page, country: Object.keys(d.countries)[0] || "Unknown" });
                });
            });
            return { summary, visitsByDate, countries, events };
        }

        function renderSummary(summary) {
            document.getElementById('summary').innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Views</h3>
                    <p class="text-3xl font-bold text-blue-600">${summary.views}</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Clicks</h3>
                    <p class="text-3xl font-bold text-green-600">${summary.clicks}</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Downloads</h3>
                    <p class="text-3xl font-bold text-purple-600">${summary.downloads}</p>
                </div>
            `;
        }

        function renderVisitsChart(visitsByDate) {
            const ctx = document.getElementById('visitsChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Object.keys(visitsByDate),
                    datasets: [{
                        label: 'Views',
                        data: Object.values(visitsByDate),
                        borderColor: '#007AFF',
                        backgroundColor: 'rgba(0,122,255,0.1)',
                        fill: true,
                        tension: 0.3,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderCountriesChart(countries) {
            const ctx = document.getElementById('countriesChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(countries),
                    datasets: [{
                        label: 'Visits',
                        data: Object.values(countries),
                        backgroundColor: [
                            '#007AFF', '#34C759', '#8B5CF6', '#FF9500', '#FF2D55', '#6B7280', '#FFCC00', '#AF52DE', '#5AC8FA', '#FF3B30'
                        ],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function renderEventsTable(events) {
            document.getElementById('eventsTable').innerHTML = events.map(ev => `
                <tr>
                    <td class="px-4 py-2">${ev.date}</td>
                    <td class="px-4 py-2">${ev.page}</td>
                    <td class="px-4 py-2">${ev.type}</td>
                    <td class="px-4 py-2">${ev.country}</td>
                    <td class="px-4 py-2">${ev.btn ? 'Download' : ''}</td>
                </tr>
            `).join('');
        }

        async function renderDashboard() {
            const { summary, visitsByDate, countries, events } = await fetchAnalytics();
            renderSummary(summary);
            renderVisitsChart(visitsByDate);
            renderCountriesChart(countries);
            renderEventsTable(events);
        }

        renderDashboard();
    </script>
</body>
</html>
