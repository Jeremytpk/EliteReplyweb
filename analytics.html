<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - EliteReply</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <div class="container mx-auto py-12 px-4">
        <h1 class="text-4xl font-bold text-gray-900 mb-8 text-center">Analytics Dashboard</h1>
        <div class="flex flex-col md:flex-row justify-center items-center gap-4 mb-8">
            <div class="flex items-center gap-2">
                <label for="viewSelect" class="font-semibold">Voir :</label>
                <select id="viewSelect" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="currentWeek">Semaine en cours</option>
                    <option value="lastWeek">Semaine dernière</option>
                    <option value="month">Mois</option>
                    <option value="year">Année</option>
                </select>
                <input type="month" id="monthPick" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 hidden" min="2024-01" max="2025-12">
                <select id="yearPick" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500 hidden">
                    <option value="">Année...</option>
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                </select>
            </div>
            <div class="flex items-center gap-2">
                <label for="timeFilter" class="font-semibold">Période :</label>
                <select id="timeFilter" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <option value="week">Semaine</option>
                    <option value="month">Mois</option>
                    <option value="year">Année</option>
                </select>
                <span id="weekSelectors" style="display:none;">
                    <label for="weekStart" class="ml-2">De :</label>
                    <input type="week" id="weekStart" class="border rounded px-2 py-1" />
                    <label for="weekEnd" class="ml-2">à</label>
                    <input type="week" id="weekEnd" class="border rounded px-2 py-1" />
                </span>
                <span id="monthSelector" style="display:none;">
                    <label for="monthPick" class="ml-2">Mois :</label>
                    <input type="month" id="monthPick" class="border rounded px-2 py-1" min="2024-01" />
                </span>
                <span id="yearSelector" style="display:none;">
                    <label for="yearPick" class="ml-2">Année :</label>
                    <select id="yearPick" class="border rounded px-2 py-1">
                        <option value="2024">2024</option>
                        <option value="2025">2025</option>
                    </select>
                </span>
            </div>
            <button id="downloadCsvBtn" class="bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-blue-700 transition-all shadow-lg">Télécharger CSV</button>
            <div class="flex items-center gap-2">
                <input id="emailTo" type="email" placeholder="Email destinataire" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <input id="emailTitle" type="text" placeholder="Titre" class="border border-gray-300 rounded px-2 py-1 bg-white text-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" />
                <button id="sendCsvBtn" class="bg-green-600 text-white px-5 py-2 rounded-lg font-semibold hover:bg-green-700 transition-all shadow-lg">Envoyer CSV</button>
            </div>
        </div>
        <div id="summary" class="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12"></div>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 mb-12">
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-xl font-bold mb-4">Visits by Date</h2>
                <canvas id="visitsChart"></canvas>
            </div>
            <div class="bg-white rounded-2xl shadow-lg p-8">
                <h2 class="text-xl font-bold mb-4">Countries</h2>
                <canvas id="countriesChart"></canvas>
            </div>
        </div>
        <div class="bg-white rounded-2xl shadow-lg p-8 mb-12">
            <h2 class="text-xl font-bold mb-4">Events Log</h2>
                
                <div id="eventsTableContainer" class="overflow-x-auto rounded-lg shadow-md bg-white max-h-96 overflow-y-scroll">
                    <table id="eventsTable" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0 z-10">
                            <tr>
                                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Type</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Date/Heure</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Pays</th>
                                <th class="px-4 py-2 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider">Détails</th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Events will be rendered here -->
                        </tbody>
                    </table>
                </div>
                <div class="flex justify-center items-center gap-2 mt-4" id="eventsPagination">
                    <button id="prevEventsPage" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-700">Précédent</button>
                    <span id="eventsPageInfo" class="font-semibold"></span>
                    <button id="nextEventsPage" class="px-3 py-1 rounded bg-gray-200 hover:bg-gray-300 text-gray-700">Suivant</button>
                </div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore.js";
        import { firebaseConfig } from "../firebaseConfig.js";

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        function filterEventsByPeriod(events, period, viewType) {
            const now = new Date();
            if (viewType === 'currentWeek') {
                const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay());
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                return events.filter(ev => {
                    const d = new Date(ev.date);
                    return d >= start && d <= end;
                });
            } else if (viewType === 'lastWeek') {
                const start = new Date(now.getFullYear(), now.getMonth(), now.getDate() - now.getDay() - 7);
                const end = new Date(start);
                end.setDate(start.getDate() + 6);
                return events.filter(ev => {
                    const d = new Date(ev.date);
                    return d >= start && d <= end;
                });
            } else if (viewType === 'month') {
                const monthPick = document.getElementById('monthPick').value;
                if (monthPick) {
                    const [year, month] = monthPick.split('-');
                    return events.filter(ev => {
                        const d = new Date(ev.date);
                        return d.getFullYear() == year && (d.getMonth() + 1) == parseInt(month);
                    });
                }
                return [];
            } else if (viewType === 'year') {
                const yearPick = document.getElementById('yearPick').value;
                if (yearPick) {
                    return events.filter(ev => {
                        const d = new Date(ev.date);
                        return d.getFullYear() == yearPick;
                    });
                }
                return [];
            }
            // Default: return all
            return events;
        }

        async function fetchAnalytics() {
            const datasCol = collection(db, "datas");
            const snapshot = await getDocs(datasCol);
            let summary = { views: 0, clicks: 0, downloads: 0 };
            let visitsByDate = {};
            let countries = {};
            let events = [];
            snapshot.forEach(doc => {
                const d = doc.data();
                summary.views += d.views || 0;
                summary.clicks += d.clicks || 0;
                summary.downloads += d.downloads || 0;
                visitsByDate[d.date] = (visitsByDate[d.date] || 0) + (d.views || 0);
                Object.entries(d.countries || {}).forEach(([country, count]) => {
                    countries[country] = (countries[country] || 0) + count;
                });
                (d.events || []).forEach(ev => {
                    events.push({ ...ev, date: d.date, page: d.page, country: Object.keys(d.countries)[0] || "Unknown" });
                });
            });
            return { summary, visitsByDate, countries, events };
        }

        function eventsToCsv(events) {
            const header = ['Date', 'Page', 'Type', 'Country', 'Details'];
            const rows = events.map(ev => [ev.date, ev.page, ev.type, ev.country, ev.btn ? 'Download' : '']);
            return [header, ...rows].map(row => row.join(',')).join('\n');
        }

        function downloadCsv(csv, title = 'analytics.csv') {
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = title;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        async function sendCsvEmail(csv, to, subject) {
            // Use Gmail SMTP via EmailJS (client-side) or instruct user to send manually
            // For security, recommend server-side or EmailJS integration
            // Here, just open mailto: with CSV attached as workaround
            const mailto = `mailto:${encodeURIComponent(to)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(csv)}`;
            window.location.href = mailto;
        }

        function renderSummary(summary) {
            document.getElementById('summary').innerHTML = `
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Views</h3>
                    <p class="text-3xl font-bold text-blue-600">${summary.views}</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Clicks</h3>
                    <p class="text-3xl font-bold text-green-600">${summary.clicks}</p>
                </div>
                <div class="bg-white rounded-2xl shadow-lg p-8 text-center">
                    <h3 class="text-lg font-bold mb-2">Total Downloads</h3>
                    <p class="text-3xl font-bold text-purple-600">${summary.downloads}</p>
                </div>
            `;
        }

        function renderVisitsChart(visitsByDate) {
            const ctx = document.getElementById('visitsChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: Object.keys(visitsByDate),
                    datasets: [{
                        label: 'Views',
                        data: Object.values(visitsByDate),
                        borderColor: '#007AFF',
                        backgroundColor: 'rgba(0,122,255,0.1)',
                        fill: true,
                        tension: 0.3,
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { display: false } }
                }
            });
        }

        function renderCountriesChart(countries) {
            const ctx = document.getElementById('countriesChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(countries),
                    datasets: [{
                        label: 'Visits',
                        data: Object.values(countries),
                        backgroundColor: [
                            '#007AFF', '#34C759', '#8B5CF6', '#FF9500', '#FF2D55', '#6B7280', '#FFCC00', '#AF52DE', '#5AC8FA', '#FF3B30'
                        ],
                    }]
                },
                options: {
                    responsive: true,
                    plugins: { legend: { position: 'bottom' } }
                }
            });
        }

        function renderEventsTable(events) {
            // Pagination logic
            const tbody = document.getElementById('eventsTableBody');
            const pagination = document.getElementById('eventsPagination');
            const pageInfo = document.getElementById('eventsPageInfo');
            const prevBtn = document.getElementById('prevEventsPage');
            const nextBtn = document.getElementById('nextEventsPage');
            const EVENTS_PER_PAGE = 20;
            let currentPage = window._eventsPage || 1;
            const totalPages = Math.max(1, Math.ceil(events.length / EVENTS_PER_PAGE));
            if (currentPage > totalPages) currentPage = totalPages;
            window._eventsPage = currentPage;
            // Render current page
            tbody.innerHTML = '';
            const startIdx = (currentPage - 1) * EVENTS_PER_PAGE;
            const endIdx = Math.min(startIdx + EVENTS_PER_PAGE, events.length);
            for (let i = startIdx; i < endIdx; i++) {
                const ev = events[i];
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="px-4 py-2 text-sm">${ev.type}</td>
                    <td class="px-4 py-2 text-sm">${ev.time ? new Date(ev.time).toLocaleString() : ''}</td>
                    <td class="px-4 py-2 text-sm">${ev.country || ''}</td>
                    <td class="px-4 py-2 text-sm">${ev.btn ? ev.btn.replace(/<[^>]+>/g, '') : (ev.platform || '')}</td>
                `;
                tbody.appendChild(tr);
            }
            // Update pagination info
            pageInfo.textContent = `Page ${currentPage} / ${totalPages}`;
            prevBtn.disabled = currentPage === 1;
            nextBtn.disabled = currentPage === totalPages;
            // Pagination button handlers
            prevBtn.onclick = () => {
                if (currentPage > 1) {
                    window._eventsPage = currentPage - 1;
                    renderEventsTable(events);
                }
            };
            nextBtn.onclick = () => {
                if (currentPage < totalPages) {
                    window._eventsPage = currentPage + 1;
                    renderEventsTable(events);
                }
            };
        }

        async function renderDashboard() {
            // Show/hide selectors based on period
            const weekSelectors = document.getElementById('weekSelectors');
            const monthSelector = document.getElementById('monthSelector');
            const yearSelector = document.getElementById('yearSelector');
            function updateSelectors() {
                const tf = document.getElementById('timeFilter');
                weekSelectors.style.display = tf.value === 'week' ? '' : 'none';
                monthSelector.style.display = tf.value === 'month' ? '' : 'none';
                yearSelector.style.display = tf.value === 'year' ? '' : 'none';
            }
            document.getElementById('timeFilter').onchange = updateSelectors;
            updateSelectors();
            const { summary, visitsByDate, countries, events } = await fetchAnalytics();
            const viewSelect = document.getElementById('viewSelect');
            const timeFilter = document.getElementById('timeFilter');
            const monthPick = document.getElementById('monthPick');
            const yearPick = document.getElementById('yearPick');
            function updatePickers() {
                if (viewSelect.value === 'month') {
                    monthPick.classList.remove('hidden');
                    yearPick.classList.add('hidden');
                } else if (viewSelect.value === 'year') {
                    yearPick.classList.remove('hidden');
                    monthPick.classList.add('hidden');
                } else {
                    monthPick.classList.add('hidden');
                    yearPick.classList.add('hidden');
                }
            }
            function updateView() {
                updatePickers();
                const filtered = filterEventsByPeriod(events, timeFilter.value, viewSelect.value);
                // Recalculate summary, visitsByDate, countries for filtered events
                let filteredSummary = { views: 0, clicks: 0, downloads: 0 };
                let filteredVisitsByDate = {};
                let filteredCountries = {};
                filtered.forEach(ev => {
                    filteredSummary.views += ev.type === 'view' ? 1 : 0;
                    filteredSummary.clicks += ev.type === 'click' ? 1 : 0;
                    filteredSummary.downloads += ev.type === 'download' ? 1 : 0;
                    filteredVisitsByDate[ev.date] = (filteredVisitsByDate[ev.date] || 0) + (ev.type === 'view' ? 1 : 0);
                    filteredCountries[ev.country] = (filteredCountries[ev.country] || 0) + 1;
                });
                renderSummary(filteredSummary);
                renderVisitsChart(filteredVisitsByDate);
                renderCountriesChart(filteredCountries);
                renderEventsTable(filtered);
            }
            viewSelect.onchange = updateView;
            timeFilter.onchange = updateView;
            monthPick.onchange = updateView;
            yearPick.onchange = updateView;
            document.getElementById('weekStart').onchange = updateView;
            document.getElementById('weekEnd').onchange = updateView;
            updateView();

            // CSV download and email logic
            const downloadBtn = document.getElementById('downloadCsvBtn');
            const sendBtn = document.getElementById('sendCsvBtn');
            downloadBtn.onclick = () => {
                const filtered = filterEventsByPeriod(events, timeFilter.value, viewSelect.value);
                const csv = eventsToCsv(filtered);
                downloadCsv(csv, `analytics_${viewSelect.value}_${timeFilter.value}.csv`);
            };
            sendBtn.onclick = () => {
                const filtered = filterEventsByPeriod(events, timeFilter.value, viewSelect.value);
                const csv = eventsToCsv(filtered);
                const to = document.getElementById('emailTo').value;
                const subject = document.getElementById('emailTitle').value || 'Analytics CSV';
                if (to) {
                    sendCsvEmail(csv, to, subject);
                } else {
                    alert('Veuillez entrer un email destinataire.');
                }
            };
        }

        renderDashboard();
    </script>
</body>
</html>
